name: specrail
version: 0.4.0
description: Issue-first, spec-first, AI-assisted repository workflow pack.

durable_state:
  provider: github
  objects:
    - issues
    - labels
    - pull_requests
    - comments
    - reviews
    - branches

automation_policy:
  default_mode: dry_run
  # auth_mode is the persisted safety baseline and must remain review. It
  #   preserves per-PR explicit human merge authorization for plain implx.
  #   Only the current `implx auto` invocation may select transient auto mode;
  #   repository configuration never supplies standing merge authorization.
  auth_mode: review
  allowed_agent_actions:
    - propose_labels
    - draft_specs
    - draft_tasks
    - implement_code
    - review_pull_request
    - diagnose_ci
    - draft_release_notes
  forbidden_agent_actions:
    - force_push
    - close_disputed_issue
    - public_security_disclosure
    - permission_change

auth_modes:
  auto:
    description: "Explicit `implx auto` queue drains. The invocation authorizes ordinary delivery actions only when current-head CI, compact review, pr_gate, and merge state are green. Heavy work still requires explicit human merge authorization. Missing heavy spec packets and all human choices are reported instead of bypassed."
    allowed_agent_actions:
      - merge_on_complete_evidence
      - close_issue_on_merged_evidence
    waived_human_gates:
      - spec_approval
      - final_pr_review
      - merge
  review:
    description: "Per-PR explicit human merge authorization in the current conversation. Freshly drafted specs wait for human confirmation before implementation."
    forbidden_agent_actions:
      - final_approval
      - merge
    waived_human_gates: []

required_human_gates:
  - readiness_label
  - spec_approval
  - final_pr_review
  - security_decision
  - merge
  - release

verification_profiles:
  default: standard
  profiles:
    fastlane:
      requires_spec_packet: false
      requires_independent_review: false
      max_review_rounds: 1
      merge_authorization: invocation
    standard:
      requires_spec_packet: false
      requires_independent_review: true
      max_review_rounds: 2
      merge_authorization: invocation
    heavy:
      requires_spec_packet: true
      requires_independent_review: true
      max_review_rounds: 2
      merge_authorization: explicit_human

# Consumer repositories populate these repo-relative glob registries. Empty
# registries preserve compatibility; a configured registry makes trusted path
# evidence mandatory for implement and PR gates.
enforcement:
  sensitive_registry:
    paths: []
    specs: []

# Repo-owned coverage contract for CI evidence that may be reused when only
# unrelated content categories changed. Consumer overlays declare their own
# check names and covered categories; unknown checks fail closed.
evidence:
  ci_component_coverage:
    workflow-check:
      - code_inputs
      - spec_files

artifacts:
  spec_packet: specs/GH{issue_number}/
  product_spec: specs/GH{issue_number}/product.md
  tech_spec: specs/GH{issue_number}/tech.md
  task_plan: specs/GH{issue_number}/tasks.md
  impl_branch: "{agent}/gh{issue_number}-{slug}"
  agent_review: artifacts/review/pr-{pr_number}.json
  closure_audit_result: artifacts/closure/pr-{pr_number}.json
  triage_result: artifacts/triage/issue-{issue_number}.json

action_policy:
  actions:
    triage_issue:
      allowed_from:
        - new_issue
        - needs_info
      required_artifacts: []
      creates_artifacts:
        - triage_result
      human_gates: []

    write_spec:
      allowed_from:
        - ready_to_spec
      required_artifacts:
        - linked_issue
      creates_artifacts:
        - product_spec
        - tech_spec
      human_gates:
        - readiness_label

    implement:
      allowed_from:
        - ready_to_implement
      required_artifacts:
        - linked_issue
      creates_artifacts: []
      human_gates:
        - readiness_label

    review_pr:
      allowed_from:
        - in_progress
        - review
      required_artifacts:
        - linked_issue
        - linked_pr
        - verification
      creates_artifacts:
        - agent_review
      human_gates:
        - final_pr_review

    fix_ci:
      allowed_from:
        - review
      required_artifacts:
        - linked_pr
      creates_artifacts:
        - verification
      human_gates: []

    draft_release_note:
      allowed_from:
        - done
      required_artifacts:
        - linked_pr
      creates_artifacts: []
      human_gates:
        - release

presentation:
  default_locale: en-US
  supported_locales:
    - en-US
    - zh-CN
  fallback_locale: en-US
