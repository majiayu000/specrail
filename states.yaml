states:
  new_issue:
    owner: requester
    next:
      - needs_info
      - ready_to_spec
      - ready_to_implement
      - parked

  needs_info:
    owner: requester
    next:
      - ready_to_spec
      - ready_to_implement
      - parked

  ready_to_spec:
    owner: maintainer
    next:
      - ready_to_implement
      - parked

  ready_to_implement:
    owner: maintainer
    next:
      - in_progress
      - parked

  in_progress:
    owner: contributor_or_agent
    next:
      - review
      - parked

  review:
    owner: contributor_or_agent
    next:
      - in_progress
      - done
      - parked

  done:
    owner: maintainer
    terminal: true

  parked:
    owner: maintainer
    next:
      - ready_to_spec
      - ready_to_implement
